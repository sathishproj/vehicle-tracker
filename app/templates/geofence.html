{% extends "base.html" %}{% block content %}<h2>Geo-Fence Setup</h2><div class="card"><form method="post"><label>Boundary Name</label><input name="name" value="Hyderabad Operating Zone"><label>Center Latitude</label><input name="center_lat" value="17.3850"><label>Center Longitude</label><input name="center_lng" value="78.4867"><label>Radius</label><input name="radius_meters" value="12000"><button>Submit / View</button></form></div><table><tr><th>Name</th><th>Latitude</th><th>Longitude</th><th>Radius</th></tr>{% for f in fences %}<tr><td>{{ f.name }}</td><td>{{ f.center_lat }}</td><td>{{ f.center_lng }}</td><td>{{ f.radius_meters }} meters</td></tr>{% endfor %}</table>{% endblock %}
