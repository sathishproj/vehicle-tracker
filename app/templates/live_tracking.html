{% extends "base.html" %}{% block content %}<h2>Live GPS Tracking</h2><div class="card"><form method="post"><label>Selected Vehicle</label><select name="vehicle_id">{% for v in vehicles %}<option value="{{ v.id }}">{{ v.vehicle_no }}</option>{% endfor %}</select><label>Latitude</label><input name="latitude" value="17.3850"><label>Longitude</label><input name="longitude" value="78.4867"><label>Speed</label><input name="speed" value="42"><label>Location</label><input name="location" value="Hyderabad"><button>Submit / Track</button></form></div><table><tr><th>Vehicle</th><th>Latitude</th><th>Longitude</th><th>Speed</th><th>Location</th><th>ML Status</th></tr>{% for l in latest %}<tr><td>{{ l.vehicle.vehicle_no }}</td><td>{{ l.latitude }}</td><td>{{ l.longitude }}</td><td>{{ l.speed }}</td><td>{{ l.location }}</td><td>{{ l.anomaly_reason }}</td></tr>{% endfor %}</table>{% endblock %}
